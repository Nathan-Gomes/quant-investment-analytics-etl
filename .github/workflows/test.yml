name: Validate research pipeline
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-app.txt
      - run: python -m pytest -q
      # Every registered methodology must pass the same battery before it ships.
      # A non-zero exit here fails the build exactly like a failing unit test.
      - run: python -m app.conformance
      - run: python -m src.pipeline --source synthetic
      - run: python scripts/build_notebook.py
      - run: python tools/build_demo.py
      # The MATLAB implementation is only worth having if it actually runs.
      # Octave executes the same .m files, so the third implementation is
      # verified on every push without a MATLAB licence in CI.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: python -m tools.export_for_matlab
      - run: octave --no-gui matlab/verify_against_python.m
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-report
          path: output/
