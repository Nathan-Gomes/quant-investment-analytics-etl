# Render deployment for the Strata API and interface.
services:
  - type: web
    name: nathan-portfolio-lab   # renaming the service would change its URL, so it stays
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STRATA_SOURCE
        value: auto
      # A free instance loses its disk on every restart, so a cold cache means
      # re-downloading every ticker. A longer window keeps prices between naps.
      - key: STRATA_CACHE_HOURS
        value: "72"
      - key: STRATA_DOWNLOAD_WORKERS
        value: "8"
    # A persistent disk removes the cold-cache cost entirely. Free instances
    # cannot mount one; on a paid plan, uncomment this.
    # disk:
    #   name: price-cache
    #   mountPath: /srv/app/cache
    #   sizeGB: 1
